[project]
name = "python-prj-seed"
version = "0.1.0"
description = "Seed repository for Python applications."
authors = [
    { name = "rlopc" }
]
requires-python = ">=3.14"
# Declared as an SPDX expression (PEP 639) and not left to the LICENSE file
# alone, so a project copied from this seed states its terms in its own
# metadata instead of inheriting an unnamed licence.
license = "MIT"
license-files = ["LICENSE"]
# This project is never distributed: it is packaged only so it can be installed
# into the local environment. PyPI rejects any classifier starting with
# "Private ::", so an accidental upload fails at the server instead of
# succeeding quietly. This guards PyPI only, not private indexes, and a project
# copied from this seed that IS meant to be published must remove it.
classifiers = ["Private :: Do Not Upload"]

dependencies = []

[project.scripts]
python-prj-seed = "python_prj_seed.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "rust-just>=1.59.0",
]
release = [
    "python-semantic-release>=10.7.0",
]

[tool.mypy]
strict = true
# mypy does not read requires-python: it checks against whichever interpreter
# runs it. Pinned so the checked version cannot drift. See ADR-0007.
python_version = "3.14"
# Lets a bare `uv run mypy` check the right tree.
files = ["src", "tests"]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
# importlib is pytest's recommended import mode for new projects: it leaves
# sys.path alone, so tests can only import the installed package.
addopts = ["-ra", "--import-mode=importlib"]
strict = true
filterwarnings = ["error"]

[tool.ruff.lint]
# Extend Ruff's default rule set rather than replace it: since 0.16 the default
# is a curated selection of several hundred rules. Security rules are off by
# default because they favour false positives; they are wanted here. ADR-0010.
extend-select = ["S"]

[tool.ruff.lint.per-file-ignores]
# Tests assert by design.
"tests/**" = ["S101"]

[tool.coverage.run]
branch = true
source_pkgs = ["python_prj_seed"]

[tool.coverage.report]
# See ADR-0009.
fail_under = 100
show_missing = true
skip_covered = true

[tool.semantic_release]
# The only version source; see ADR-0013. The build step re-locks so uv.lock
# records the new version and `uv sync --locked` keeps passing after a release.
version_toml = ["pyproject.toml:project.version"]
build_command = 'uv lock --upgrade-package "$PACKAGE_NAME" && git add uv.lock'
commit_message = "chore(release): v{version}"
# Stay on 0.x until 1.0.0 is cut deliberately: breaking changes bump the minor.
allow_zero_version = true
major_on_zero = false
