name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pushes to a PR are cancelled; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Every uv command fails on a stale lockfile instead of re-locking it.
  # See docs/engineering-standards.md, section 2.
  UV_LOCKED: "1"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Pinned so CI does not change behaviour on a uv release. Dependabot
          # does not track this input; bump it by hand.
          version: "0.12.3"

      - run: uv sync --locked

      - run: uv run just verify
